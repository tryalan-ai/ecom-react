<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} &middot; {{ site.title }}</title>
<link rel="stylesheet" href="{{ page.asset_prefix }}style.css">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ page.asset_prefix }}feed.xml">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ page.home }}">{{ site.title }}</a>
</header>
<div class="layout">
  <nav class="site-nav">
    {{{ nav }}}
  </nav>
  <main class="content">
    {{{ content }}}
    {% if toc %}
    <aside class="toc-wrap">
      <h2>On this page</h2>
      {{{ toc }}}
    </aside>
    {% endif %}
  </main>
</div>
<footer class="site-footer">Generated by sitegen</footer>
</body>
</html>
